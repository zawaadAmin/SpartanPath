<style>
/* Layout: one centered column, one question at a time, like a campus orientation card deck */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --ink:#111a2e; --muted:#5a6580; --line:#d9deea;
  --blue:#0055a2; --gold:#e5a823; --gold-ink:#5c3f00; --blue-soft:#e3edf8;

  --body:"Inter", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1220; --surface:#151d30; --ink:#e9edf6; --muted:#9aa5c0; --line:#2a3550;
  --blue:#6aa8ec; --gold:#f2bd4b; --gold-ink:#f7d58b; --blue-soft:#18284a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1220; --surface:#151d30; --ink:#e9edf6; --muted:#9aa5c0; --line:#2a3550;
  --blue:#6aa8ec; --gold:#f2bd4b; --gold-ink:#f7d58b; --blue-soft:#18284a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:6px;background:var(--blue);position:relative;flex:none}
.mark::after{content:"";position:absolute;left:6px;right:6px;bottom:6px;height:5px;background:var(--gold);border-radius:2px}
.tag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(30px,6vw,42px);line-height:1.08;font-weight:800}
h2{font-size:clamp(22px,4.5vw,28px);line-height:1.2;font-weight:700}
h3{font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.lede{color:var(--muted);max-width:60ch}
.stack{display:flex;flex-direction:column;gap:16px}
.hl{background:linear-gradient(transparent 62%,var(--gold) 62%,var(--gold) 92%,transparent 92%);padding:0 2px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0;padding:0;list-style:none}
.steps li{border-top:3px solid var(--blue);padding-top:10px;font-size:14px;color:var(--muted)}
.steps b{display:block;color:var(--ink);font-family:var(--display);font-size:16px}
@media (max-width:520px){.steps{grid-template-columns:1fr}.card{padding:20px}}
.btn{font:600 16px var(--body);border:0;border-radius:10px;padding:13px 20px;cursor:pointer;background:var(--blue);color:#fff;align-self:flex-start}
:root[data-theme="dark"] .btn{color:#0c1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0c1220}}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}
.btn:focus-visible,.opt:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--blue);transition:width .3s}
.phase{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);background:color-mix(in srgb,var(--gold) 22%,transparent);padding:3px 8px;border-radius:4px;align-self:flex-start}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:500 16px var(--body);text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--blue);background:var(--blue-soft)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--muted);font:500 14px var(--body);cursor:pointer;padding:6px 0}
.link:hover{color:var(--ink)}
.result-head{border-left:4px solid var(--gold);padding-left:16px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
ul.clean{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:var(--blue-soft);color:var(--blue);font-weight:600;font-size:14px;padding:5px 10px;border-radius:999px}
.next{background:var(--blue-soft);border-radius:10px;padding:14px 16px}
.next b{color:var(--blue)}
.scores{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:120px 1fr 24px;align-items:center;gap:10px;font-size:14px;font-variant-numeric:tabular-nums}
.srow .bar{height:8px}
.srow.top .bar span{background:var(--gold)}
.rate{display:flex;gap:8px;flex-wrap:wrap}
.rate button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--body);cursor:pointer}
.rate button[aria-pressed="true"]{background:var(--blue);color:var(--surface);border-color:var(--blue)}
.note{font-size:13px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.search input{width:100%;font:500 16px var(--body);padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.search input:focus{outline:3px solid var(--gold);outline-offset:1px}
.mscroll{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.mlist{list-style:none;margin:0;padding:0}
.mlist li+li{border-top:1px solid var(--line)}
.mpick,.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:11px 14px;font:500 15px var(--body);color:var(--ink);text-align:left;background:none;border:0}
.mpick{cursor:pointer}.mpick:hover{background:var(--blue-soft)}
.mpick:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.mpick span:first-child,.mrow span:first-child{min-width:0}
.mtags{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.gtag{font-size:12px;color:var(--muted);white-space:nowrap}
.closed{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--gold-ink);background:color-mix(in srgb,var(--gold) 22%,transparent);padding:2px 6px;border-radius:4px;white-space:nowrap}
@media (max-width:520px){.gtag{display:none}}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.fbtn{font:600 14px var(--body);padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.fbtn span{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:2px}
.fbtn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.fbtn[aria-pressed="true"] span{color:inherit;opacity:.8}
#bres{border:1px solid var(--line);border-radius:10px}
.chip.co{background:transparent;border:1px solid var(--line);color:var(--ink)}
ul.clubs{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
ul.clubs li{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
ul.clubs b{font-weight:600}
ul.clubs span{font-size:14px;color:var(--muted)}

details.more{margin-top:12px}
details.more summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:14px}
details.more .mlist{margin-top:8px;border:1px solid var(--line);border-radius:10px}
a{color:var(--blue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

};

let state;
const app=document.getElementById("app");
function reset(){state={stage:"intro",who:null,current:null,i:0,answers:[],fi:0,fanswers:[],rating:null,bg:"",bq:""}}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function groupScores(){const s={T:0,E:0,B:0,H:0,C:0};state.answers.forEach(g=>s[g]++);return s}
function topGroup(){const s=groupScores();return Object.keys(s).reduce((a,b)=>s[b]>s[a]?b:a)}
function topCareer(g){const s={};FOLLOW[g].forEach(fq=>fq.o.forEach(o=>o[1].forEach(k=>s[k]=s[k]||0)));
  state.fanswers.forEach(ks=>ks.forEach(k=>s[k]++));
  return Object.keys(s).reduce((a,b)=>s[b]>s[a]?b:a)}

function progress(step,total,label){
  return `<div class="progress"><span>${step} / ${total}</span><div class="bar"><span style="width:${step/total*100}%"></span></div></div><span class="phase">${label}</span>`}

function question(q,opts,step,total,label,showBack){
  app.innerHTML=`<div class="stack">${progress(step,total,label)}<h2>${esc(q)}</h2>
  <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
  <div class="nav">${showBack?'<button class="link" id="back">← Back</button>':'<span></span>'}<button class="link" id="restart">Start over</button></div></div>`;
  app.querySelector(".opt").focus({preventScroll:true});
}

function majorList(list,pickable){
  if(!list.length)return `<p class="note">No majors match that search.</p>`;
  return `<ul class="mlist">${list.map(m=>`<li>${pickable?`<button class="mpick" data-n="${esc(m.n)}">`:"<div class=\"mrow\">"}<span>${esc(m.n)}</span><span class="mtags">${m.closed?'<span class="closed">Not accepting</span>':""}<span class="gtag">${GROUPS[m.g]}</span></span>${pickable?"</button>":"</div>"}</li>`).join("")}</ul>`}

function filterMajors(q,g){q=q.trim().toLowerCase();return MAJORS.filter(m=>(!g||m.g===g)&&(!q||m.n.toLowerCase().includes(q)))}

function picker(){
  app.innerHTML=`<div class="stack">${progress(1,14,"About you")}<h2>What's your current major?</h2>
    <label class="search"><span class="sr">Search majors</span><input id="msearch" type="search" placeholder="Search ${MAJORS.length} SJSU majors" autocomplete="off"></label>
    <div id="mres" class="mscroll">${majorList(MAJORS,true)}</div>
    <div class="nav"><button class="link" id="back">← Back</button><button class="link" id="skip">I'd rather not say</button></div></div>`;
  const inp=document.getElementById("msearch"),res=document.getElementById("mres");
  const wire=()=>res.querySelectorAll(".mpick").forEach(b=>b.onclick=()=>{state.current=b.dataset.n;state.stage="main";state.i=0;render()});
  inp.oninput=()=>{res.innerHTML=majorList(filterMajors(inp.value),true);wire()};wire();inp.focus({preventScroll:true});
  document.getElementById("back").onclick=()=>{state.stage="who";render()};
  document.getElementById("skip").onclick=()=>{state.current=null;state.stage="main";state.i=0;render()};
}

function browse(){
  const g=state.bg||"";
  app.innerHTML=`<div class="stack"><button class="link" id="home" style="align-self:flex-start">← Back to start</button>
    <h2>All SJSU majors</h2>
    <p class="lede">Every undergraduate major, sorted into the five quiz areas. Tap an area to filter.</p>
    <div class="filters">${[["","All"],...Object.entries(GROUPS)].map(([k,v])=>`<button class="fbtn" data-g="${k}" aria-pressed="${g===k}">${v} <span>${(k?MAJORS.filter(m=>m.g===k):MAJORS).length}</span></button>`).join("")}</div>
    <label class="search"><span class="sr">Search majors</span><input id="bsearch" type="search" placeholder="Search majors" autocomplete="off" value="${esc(state.bq||"")}"></label>
    <div id="bres">${majorList(filterMajors(state.bq||"",g),false)}</div>
    <button class="btn" id="go">Take the quiz</button></div>`;
  const inp=document.getElementById("bsearch");
  inp.oninput=()=>{state.bq=inp.value;document.getElementById("bres").innerHTML=majorList(filterMajors(inp.value,g),false)};
  app.querySelectorAll(".fbtn").forEach(b=>b.onclick=()=>{state.bg=b.dataset.g;browse()});
  document.getElementById("home").onclick=()=>{reset();render()};
  document.getElementById("go").onclick=()=>{state.stage="who";render()};
}

function render(){
  const total=1+MAIN.length+3;
  if(state.stage==="browse")return browse();
  if(state.stage==="current")return picker();
  if(state.stage==="intro"){
    app.innerHTML=`<div class="stack">
      <h1>Find the <span class="hl">SJSU major</span> that fits the career you want.</h1>
      <p class="lede">For high schoolers looking at SJSU and Spartans thinking about switching majors. Answer 14 quick questions and get a career match with the majors, classes, and next steps that lead there.</p>
      <ul class="steps">
        <li><b>10 questions</b>Find your strongest area</li>
        <li><b>3 follow-ups</b>Narrow it to a career</li>
        <li><b>Your path</b>Majors, classes, clubs</li>
      </ul>
      <div class="nav" style="justify-content:flex-start"><button class="btn" id="go">Start the quiz</button><button class="btn ghost" id="browse">Browse all ${MAJORS.length} majors</button></div>
      <p class="note">About 3 minutes. Nothing you answer is saved or sent anywhere.</p></div>`;
    document.getElementById("go").onclick=()=>{state.stage="who";render()};
    document.getElementById("browse").onclick=()=>{state.stage="browse";render()};return;
  }
  if(state.stage==="who"){question(START.q,START.opts,1,total,"About you",false);bind(k=>{state.who=k;if(k===1){state.stage="current"}else{state.current=null;state.stage="main";state.i=0}render()});return}
  if(state.stage==="main"){const q=MAIN[state.i];question(q.q,q.o.map(o=>o[0]),2+state.i,total,"Part 1 · Your strengths",true);
    bind(k=>{state.answers[state.i]=q.o[k][1];state.i++;if(state.i>=MAIN.length){state.stage="follow";state.fi=0;state.fanswers=[]}render()});return}
  if(state.stage==="follow"){const g=topGroup();const q=FOLLOW[g][state.fi];
    question(q.q,q.o.map(o=>o[0]),2+MAIN.length+state.fi,total,`Part 2 · ${GROUPS[g]} careers`,true);
    bind(k=>{state.fanswers[state.fi]=q.o[k][1];state.fi++;if(state.fi>=3)state.stage="result";render()});return}
  if(state.stage==="result")return result();
}

function bind(onPick){
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>onPick(+b.dataset.k));
  const back=document.getElementById("back");
  if(back)back.onclick=()=>{
    if(state.stage==="main"){if(state.i===0)state.stage=state.who===1?"current":"who";else state.i--}
    else if(state.stage==="follow"){if(state.fi===0){state.stage="main";state.i=MAIN.length-1}else state.fi--}
    render()};
  document.getElementById("restart").onclick=()=>{reset();render()};
}

function result(){
  const g=topGroup(),key=topCareer(g),c=CAREERS[key],s=groupScores();
  const others=Object.keys(CAREERS).filter(k=>CAREERS[k].g===g&&k!==key).map(k=>CAREERS[k].n);
  const switching=state.who===1;
  const order=Object.keys(s).sort((a,b)=>s[b]-s[a]);
  const cur=state.current,curM=cur&&MAJORS.find(m=>m.n===cur);
  let switchNote="";
  if(cur){const fits=PATHS[key].includes(cur);
    switchNote=`<div class="next"><b>You're in ${esc(cur)}.</b> ${fits?"Good news: your current major already leads to this career. Talk to your advisor about classes and experience that point you toward it.":curM&&curM.g===g?"Your major is in the same area as this match, so some of your classes may already count. Ask an advisor which ones transfer.":"This match is in a different area from your major. Before switching, take one intro class in a major above and see if you like it."}</div>`}
  const groupMajors=MAJORS.filter(m=>m.g===g&&!PATHS[key].includes(m.n));
  const extra=`<details class="more"><summary>See all ${groupMajors.length} other ${GROUPS[g]} majors</summary>${majorList(groupMajors,false)}</details>`;
  app.innerHTML=`<div class="stack" style="gap:24px">
    <div class="result-head"><span class="eyebrow">Your top match in ${GROUPS[g]}</span><h1>${c.n}</h1></div>
    <p>${c.d}</p>
    <div><h3>SJSU majors that lead here</h3><div class="chips">${PATHS[key].map(m=>`<span class="chip">${esc(m)}</span>`).join("")}</div>${extra}</div>
    ${switchNote}
    <div><h3>Classes you'd take</h3><ul class="clean">${c.c.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    <div><h3>Companies to apply to</h3><div class="chips">${COMPANIES[key].map(x=>`<span class="chip co">${esc(x)}</span>`).join("")}</div>
      <p class="note" style="margin-top:8px">${COMPANYTIP[key]?COMPANYTIP[key]+" ":""}Search each company's careers page for internships, usually posted in the fall for the next summer. Handshake, SJSU's job board, lists roles open to Spartans.</p></div>
    <div><h3>SJSU clubs to join</h3>
      ${CLUBS[key].length?`<ul class="clubs">${CLUBS[key].map(([n,d])=>`<li><b>${esc(n)}</b><span>${esc(d)}</span></li>`).join("")}</ul>`:""}
      <p class="note" style="margin-top:8px">${CLUBNOTE[key]?CLUBNOTE[key]+" ":""}Club lists change each year. See every group on <a href="https://sjsu.edu/getinvolved/student-orgs/index.php" target="_blank" rel="noopener">SJSU's student organizations page</a>.</p></div>
    <div><h3>${switching?"Switching into these majors":state.who===0?"Getting in as a new student":"Declaring one of these majors"}</h3>
      <p style="margin-top:6px">${IMPACT} Major details live in the <a href="https://catalog.sjsu.edu/" target="_blank" rel="noopener">SJSU catalog</a>.</p></div>
    <div class="next"><b>Try this next:</b> ${c.x}</div>
    <div><h3>Your strengths</h3><div class="scores" style="margin-top:10px">${order.map(k=>`<div class="srow ${k===g?"top":""}"><span>${GROUPS[k]}</span><div class="bar"><span style="width:${s[k]/MAIN.length*100}%"></span></div><span>${s[k]}</span></div>`).join("")}</div></div>
    <p class="note">Also worth exploring in ${GROUPS[g]}: ${others.join(", ")}.</p>
    <div class="stack" style="gap:10px;border-top:1px solid var(--line);padding-top:20px">
      <h3>How accurate was this?</h3>
      <div class="rate" role="group" aria-label="Rate accuracy from 1 to 5">${[1,2,3,4,5].map(n=>`<button data-r="${n}" aria-pressed="${state.rating===n}">${n}</button>`).join("")}</div>
      <p class="note" id="thanks">${state.rating?"Thanks for rating.":"1 means way off, 5 means spot on."}</p>
    </div>
    <div class="nav"><button class="btn" id="again">Take it again</button></div>
  </div>`;
  app.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{state.rating=+b.dataset.r;result()});
  document.getElementById("again").onclick=()=>{reset();render()};
}

reset();render();
</script>
